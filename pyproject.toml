[project]
name = "gui-segesferoides"
version = "0.1.0"
description = "GUI de escritorio para predecir, corregir y taggear máscaras de segmentación, independiente del modelo (habla con backends por un protocolo JSON)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "PyQt5>=5.15",
    "pyyaml",
]

[project.scripts]
gui-segesferoides = "gui_segesferoides.main:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gui_segesferoides"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
