# Copiar a config/backends.yaml (ignorado por git) y ajustar rutas.
# La GUI solo corre modelos .onnx, dentro de su propio proceso: no conoce ningún repo de modelos.
# Cada .onnx lleva al lado un manifiesto con el mismo nombre (best.onnx -> best.yaml) que dice cómo
# usarlo: ver docs/model_manifest.md. `models_glob` lista los .onnx; el más reciente arranca cargado.
backends:
  # U-Net / U-ResNet (segmentación semántica: logits por píxel)
  - name: u-resnet
    models_glob:
      - ~/repos/SegmentacionEsferoides/outputs/models/*/*.onnx

  # YOLOv8-seg (segmentación por instancias)
  - name: yolo
    models_glob:
      - "~/repos/imageprocessingcylinder/GUI_yolo/controllers/video/yolo/modelos/modelos entrenados/yolov8/segmentacion/*/*/outputs/train/weights/exportados/best.onnx"

  # spheroid-seg: pendiente de exportar a .onnx (hoy es JAX). Cuando exista el .onnx y su manifiesto:
  # - name: spheroid-seg
  #   models_glob: [~/repos/spheroid-seg/outputs/onnx/*.onnx]

# Opciones opcionales de cada backend (todas tienen valor por defecto):
#   tile: 1024          mosaicos para imágenes grandes (0 = imagen entera)
#   tile_overlap: 128   px de contexto por lado de cada mosaico
#   workers: 4          mosaicos en paralelo (por defecto min(4, núcleos // 3))
#   conf / iou          pisan los umbrales de un modelo instance-seg
